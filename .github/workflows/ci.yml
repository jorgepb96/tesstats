name: Build and test

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**.md"
  pull_request:
  workflow_dispatch:
    inputs:
      xcode:
        description: "Xcode version, e.g. 26.4 (default: newest installed)"
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ github.event.inputs.xcode }}
        run: |
          echo "Installed: $(ls -d /Applications/Xcode_*.app | xargs -n1 basename | tr '\n' ' ')"
          if [ -n "$XCODE_VERSION" ]; then
            XCODE="/Applications/Xcode_${XCODE_VERSION}.app"
          else
            XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Unit tests (iOS Simulator)
        run: |
          set -o pipefail
          mkdir -p build
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), key=lambda k: [int(p) for p in k.rsplit("iOS-", 1)[-1].split("-")])
          for runtime in reversed(ios):
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "Simulator: $DEVICE_ID"
          xcodebuild \
            -project Tesstats.xcodeproj \
            -scheme Tesstats \
            -configuration Debug \
            -destination "id=$DEVICE_ID" \
            -only-testing:TesstatsTests \
            test | tee build/xcodebuild-test.log | grep -E "error:|Test Case .* failed|Executed [0-9]+ tests|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/xcodebuild-test.log || {
            echo "::group::Failure summary"
            grep -E "error:|Testing failed|failed \(|requires a development team|provisioning|\*\* TEST" build/xcodebuild-test.log | cut -c1-400 | head -n 80
            sed -n '/Testing failed:/,/\*\* TEST/p' build/xcodebuild-test.log | cut -c1-400 | head -n 80
            echo "::endgroup::"
            exit 1
          }

      - name: Release build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -project Tesstats.xcodeproj \
            -scheme Tesstats \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build/xcodebuild-release.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build/xcodebuild-release.log || {
            grep -E "error:|\*\* BUILD" build/xcodebuild-release.log | cut -c1-400 | head -n 80
            exit 1
          }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: build/*.log
          if-no-files-found: ignore
