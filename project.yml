name: Tesstats
options:
  bundleIdPrefix: com.tesstats
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "5.6.3"
    CURRENT_PROJECT_VERSION: "40"
    DEVELOPMENT_TEAM: "6RPLS9EA4X"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO

targets:
  Tesstats:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "18.0"
      macOS: "15.0"
    sources:
      - path: Tesstats
    dependencies:
      - target: TesstatsWidgets
        embed: true
        destinationFilters: [iOS]
      - target: TesstatsWatch
        embed: true
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tesstats.app
        PRODUCT_NAME: Tesstats
        INFOPLIST_FILE: Tesstats/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tesstats/Resources/Tesstats.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"

  TesstatsWidgets:
    type: app-extension
    supportedDestinations: [iOS]
    deploymentTarget:
      iOS: "18.0"
    sources:
      - path: TesstatsWidgets
      - path: Tesstats/Shared
      - path: Tesstats/DesignSystem/Theme.swift
      - path: Tesstats/Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tesstats.app.widgets
        PRODUCT_NAME: TesstatsWidgets
        INFOPLIST_FILE: TesstatsWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: TesstatsWidgets/TesstatsWidgets.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"

  TesstatsWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: TesstatsWatch
      - path: Tesstats/Shared
      - path: Tesstats/Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tesstats.app.watchkitapp
        PRODUCT_NAME: Tesstats
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.tesstats.app
        INFOPLIST_KEY_CFBundleDisplayName: Tesstats
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete

  TesstatsTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    deploymentTarget:
      iOS: "18.0"
    sources:
      - path: TesstatsTests
    dependencies:
      - target: Tesstats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tesstats.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete

  TesstatsUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    deploymentTarget:
      iOS: "18.0"
    sources:
      - path: TesstatsUITests
    dependencies:
      - target: Tesstats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tesstats.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  Tesstats:
    build:
      targets:
        Tesstats: all
        TesstatsTests: [test]
        TesstatsUITests: [test]
    test:
      config: Debug
      targets:
        - TesstatsTests
        - TesstatsUITests
